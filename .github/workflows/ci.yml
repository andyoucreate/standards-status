name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The home page is prerendered at build time. Pointing the API at an unreachable host
      # builds the "unavailable" state; a real deploy gets real variables from Vercel.
      - run: pnpm build
        env:
          STANDARDS_API_URL: http://127.0.0.1:9
          STANDARDS_API_KEY: ci
          CRON_SECRET: ci
